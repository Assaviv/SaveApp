plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aviv'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	otelAgent
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2025.1.4')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	otelAgent 'io.opentelemetry.javaagent:opentelemetry-javaagent:2.34.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
	useJUnitPlatform()
}

// Aspire sets OTEL_EXPORTER_OTLP_ENDPOINT: attach the OpenTelemetry Java agent so traces, metrics and logs reach the dashboard.
tasks.named('bootRun') {
	if (System.getenv('OTEL_EXPORTER_OTLP_ENDPOINT')) {
		jvmArgs "-javaagent:${configurations.otelAgent.singleFile}"
	}
}
